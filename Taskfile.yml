version: "3"

tasks:
  # Development Tools
  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:8090" --cmd="go run ./cmd/docs/main.go" --open-browser=false

  shiki-highlighter:
    desc: Start shiki syntax highlighter service
    dir: shiki
    cmds:
      - npm start

  tailwind-clean:
    desc: Clean tailwind output
    cmds:
      - "tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --clean"

  tailwind-watch:
    desc: Run tailwindcss in watch mode
    cmds:
      - "tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --watch"

  minify-js-components:
    desc: Minify and watch JavaScript component files
    cmds:
      - |
        npx esbuild \
        components/accordion/accordion.js \
        components/avatar/avatar.js \
        components/calendar/calendar.js \
        components/carousel/carousel.js \
        components/chart/chart.js \
        components/collapsible/collapsible.js \
        components/combobox/combobox.js \
        components/contextmenu/contextmenu.js \
        components/copybutton/copybutton.js \
        components/dialog/dialog.js \
        components/dropdownmenu/dropdownmenu.js \
        components/hovercard/hovercard.js \
        components/inputgroup/inputgroup.js \
        components/inputotp/inputotp.js \
        components/label/label.js \
        components/popover/popover.js \
        components/progress/progress.js \
        components/select/select.js \
        components/sidebar/sidebar.js \
        components/slider/slider.js \
        components/tabs/tabs.js \
        components/toast/toast.js \
        components/tooltip/tooltip.js \
        components/toggle/toggle.js \
        --minify \
        --watch \
        --bundle \
        --outdir=components \
        --out-extension:.js=.min.js

  dev:
    desc: Start development server with hot reload
    deps:
      - tailwind-clean
    cmds:
      - task --parallel tailwind-watch templ shiki-highlighter minify-js-components

  # Build & Validation
  templ-generate:
    desc: Compile templ files into Go
    cmds:
      - go tool templ generate

  render-showcases:
    desc: Render showcase components into out/showcase/
    cmds:
      - go run ./cmd/render-showcases

  build-html:
    desc: Build static showcase HTML
    cmds:
      - task: templ-generate
      - task: render-showcases
      - echo "✅ Static showcase HTML rendered to ./out"

  lint-html:
    desc: Lint HTML output using ESLint
    cmds:
      - npx eslint --fix "out/**/*.html" --ext .html

  validate-html:
    desc: Run full pipeline (build + lint)
    cmds:
      - task: build-html
      - task: lint-html

  # Generators
  generate-sitemap:
    desc: Generate sitemap.xml
    cmds:
      - go run ./cmd/sitemap/main.go --baseurl="https://templui.io" --routes="./cmd/docs/main.go" --output="./static/sitemap.xml"

  generate-icons:
    desc: Generate icon definitions
    cmds:
      - go run cmd/icongen/main.go

  generate-llms:
    desc: Generate llms.txt from registry.json
    cmds:
      - go run cmd/generate-llms/main.go

  install-compinstall:
    desc: Install compinstall tool
    cmds:
      - go install ./cmd/compinstall

  install-templui:
    desc: Install templui CLI from the current local checkout
    cmds:
      - go install ./cmd/templui
