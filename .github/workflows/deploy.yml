# Off-host build for v1, the same pattern as the v2 branch: GitHub's
# free ARM runners build the image, ghcr.io stores it, Dokploy only
# pulls (Provider: Docker). Triggers on main today and on v1 after
# the branch flip.
name: deploy

on:
  push:
    branches: [main, v1]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/axadrn/shadcn-templ:v1
            ghcr.io/axadrn/shadcn-templ:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The v1 app's deploy webhook (Deployments tab), its own secret.
      - name: Trigger Dokploy deploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL_V1 }}"
