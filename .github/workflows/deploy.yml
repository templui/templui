# Off-host build: GitHub's free ARM runners build the image, ghcr.io
# stores it, Dokploy only pulls (Provider: Docker). The server never
# compiles again. Tag-triggered releases extend this workflow later
# (see CREATE_1TO1_PLAN.md, release plan).
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/axadrn/shadcn-templ:v2
            ghcr.io/axadrn/shadcn-templ:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy pulls the fresh image; the URL is the app's deploy
      # webhook (Deployments tab) stored as a repo secret.
      - name: Trigger Dokploy deploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
